@if (visible) {
    <div class="fixed bottom-6 right-6 z-100 animate-in slide-in-from-bottom-5 fade-in duration-300 pointer-events-none">
        <div class="bg-[#0d0e10]/95 backdrop-blur-md border shadow-2xl p-4 flex items-start gap-4 max-w-md rounded"
                [class.border-red-500/50]="type === 'error'"
                [class.border-green-500/50]="type === 'success'"
                [class.border-yellow-500/50]="type === 'warning'">
            
            <div class="mt-0.5 shrink-0">
                @if (type === 'error') {
                    <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                }
                @if (type === 'success') {
                    <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                }
                @if (type === 'warning') {
                    <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                }
            </div>

            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-widest mb-1"
                    [class.text-red-500]="type === 'error'"
                    [class.text-green-500]="type === 'success'"
                    [class.text-yellow-500]="type === 'warning'">
                    System Output
                </h4>
                <p class="text-xs text-gray-300 font-mono leading-relaxed">{{ message }}</p>
            </div>
        </div>
    </div>
}
